# Skannern får lista poddar i default och inget annat.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sbom-scanner
  namespace: security-tools
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sbom-scanner-pod-reader
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sbom-scanner-pod-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: sbom-scanner
  namespace: security-tools
roleRef:
  kind: Role
  name: sbom-scanner-pod-reader
  apiGroup: rbac.authorization.k8s.io
