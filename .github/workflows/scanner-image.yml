name: Build scanner image

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scanner/**"
      - ".github/workflows/scanner-image.yml"

env:
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/sbom-scanner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # OIDC för keyless Cosign

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push scanner image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: scanner
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:sha-${{ github.sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.6.4'

      # Signaturen är det policy-controller kräver i security-tools. Den
      # godtas bara om den kommer från den här workflowen på main.
      - name: Sign scanner image
        run: cosign sign --yes "${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"

      # Digesten ska in i k8s/scanner/cronjob.yaml.
      - name: Show digest
        run: |
          echo "### Scanner-image" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
