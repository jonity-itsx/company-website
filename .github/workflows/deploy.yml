name: Deploy to K3s

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

env:
  IMAGE: ghcr.io/${{ github.repository }}:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Build & push to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }} .
          docker push ${{ env.IMAGE }}

      # --- Network connectivity to K3s node ---

      - name: Generate Ephemeral Headscale Key
        id: generate_key
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          HEADSCALE_USER_ID: ${{ vars.HEADSCALE_USER_ID }}
        run: |
          set -euo pipefail

          : "${HEADSCALE_URL:?HEADSCALE_URL is not configured}"
          : "${HEADSCALE_API_KEY:?HEADSCALE_API_KEY is not configured}"
          : "${HEADSCALE_USER_ID:?HEADSCALE_USER_ID is not configured}"

          EXPIRATION="$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%SZ')"
          URL="${HEADSCALE_URL%/}/api/v1/preauthkey"

          # Headscale expects the user field as a numeric ID.
          if ! [[ "$HEADSCALE_USER_ID" =~ ^[0-9]+$ ]]; then
            echo "HEADSCALE_USER_ID must be a numeric Headscale user ID"
            exit 1
          fi

          REQUEST_BODY="$(
            jq -n \
              --argjson user "$HEADSCALE_USER_ID" \
              --arg expiration "$EXPIRATION" \
              '{
                user: $user,
                ephemeral: true,
                reusable: false,
                expiration: $expiration,
                aclTags: ["tag:github-runner"]
              }'
          )"

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(
            curl -sS \
              -o "$RESPONSE_FILE" \
              -w '%{http_code}' \
              -X POST "$URL" \
              -H "Authorization: Bearer $HEADSCALE_API_KEY" \
              -H "Content-Type: application/json" \
              --data "$REQUEST_BODY" \
            || true
          )"

          RESPONSE="$(cat "$RESPONSE_FILE")"
          rm -f "$RESPONSE_FILE"

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "Headscale API returned HTTP $HTTP_STATUS"
            echo "Response: $RESPONSE"
            exit 1
          fi

          EPHEMERAL_KEY="$(jq -er '.preAuthKey.key' <<< "$RESPONSE")"

          echo "::add-mask::$EPHEMERAL_KEY"
          echo "key=$EPHEMERAL_KEY" >> "$GITHUB_OUTPUT"
      
      - name: Connect to Headscale Mesh
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ steps.generate_key.outputs.key }}
          args: --login-server=${{ secrets.HEADSCALE_URL }}
          version: 1.102.4

      - name: Verify connectivity to K3s node
        run: |
          ping -c 3 10.0.${{ vars.TEAM_ID }}.3
          echo "Tailscale connectivity confirmed"

      # --- Configure kubectl for remote k3s ---
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get pods -n default

      # --- Deploy to K3s ---
      - name: Apply manifests and update image
        run: |
          export DEPLOY_IMAGE="${{ env.IMAGE }}"
          envsubst < k8s/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml -f k8s/pvc.yaml -f k8s/service.yaml
          kubectl rollout status deployment/company-website --timeout=120s
