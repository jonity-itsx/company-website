name: Deploy to K3s

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Filer som inte byggs in i imagen och inte appliceras av CI. Om en push
    # bara rör dessa behövs ingen ny image eller deploy.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "helm/**"
      - "k8s/image-policy.yaml"
      - "k8s/github-permissions.yaml"
      - "docker-compose.yml"
      - ".env.example"

env:
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write          # OIDC för keyless Cosign

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # --- Build & push to GHCR ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Taggarna blir latest och sha-<kort commit-SHA>.
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_REPO }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # steps.build.outputs.digest är bara "sha256:…", så senare steg sätter
      # IMAGE_REPO@ framför för att få en fullständig referens.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v2.6.4'

      - name: Sign images with Cosign
        run: cosign sign --yes "${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"

      # --- SBOM ---
      # Syft listar alla paket i imagen (Debian + Python) i CycloneDX-format.
      # Actionen laddar även upp filen som artefakt i körningen.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json

      # Signerad attestation: SBOM:en knyts till exakt den här digesten och
      # hamnar i GHCR bredvid imagen och signaturen.
      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --type cyclonedx \
            --predicate sbom.cdx.json \
            "${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"

      # --- Network connectivity to K3s node ---

      - name: Generate Ephemeral Headscale Key
        id: generate_key
        env:
          HEADSCALE_URL: ${{ secrets.HEADSCALE_URL }}
          HEADSCALE_API_KEY: ${{ secrets.HEADSCALE_API_KEY }}
          HEADSCALE_USER: ${{ vars.HEADSCALE_USER_ID }}
        run: |
          set -euo pipefail

          : "${HEADSCALE_URL:?HEADSCALE_URL is not configured}"
          : "${HEADSCALE_API_KEY:?HEADSCALE_API_KEY is not configured}"
          : "${HEADSCALE_USER:?HEADSCALE_USER_ID is not configured}"

          BASE="${HEADSCALE_URL%/}"

          BODY_FILE="$(mktemp)"
          trap 'rm -f "$BODY_FILE"' EXIT

          # Anropar Headscale-API:t. Skriver HTTP-statusen till stdout och
          # svarskroppen till $BODY_FILE, sa att bada kan inspekteras.
          hs_api() {
            local method="$1" path="$2" data="${3:-}"
            local args=(
              -sS
              -o "$BODY_FILE"
              -w '%{http_code}'
              -X "$method" "${BASE}${path}"
              -H "Authorization: Bearer $HEADSCALE_API_KEY"
              -H "Content-Type: application/json"
            )
            if [[ -n "$data" ]]; then
              args+=(--data "$data")
            fi
            curl "${args[@]}" || true
          }

          # --- Slå upp numeriskt användar-ID ---
          # HEADSCALE_USER_ID får vara antingen ett namn ("github-ci") eller
          # ett numeriskt ID. Namn slås upp mot API:t.
          if [[ "$HEADSCALE_USER" =~ ^[0-9]+$ ]]; then
            USER_ID="$HEADSCALE_USER"
            echo "HEADSCALE_USER_ID is already numeric: $USER_ID"
          else
            STATUS="$(hs_api GET /api/v1/user)"
            USERS="$(cat "$BODY_FILE")"

            if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
              echo "Could not list Headscale users (HTTP $STATUS)"
              echo "Response: $USERS"
              exit 1
            fi

            USER_ID="$(
              jq -r --arg name "$HEADSCALE_USER" \
                '.users[]? | select(.name == $name) | .id' <<< "$USERS" \
                | head -n1
            )"

            if [[ -z "$USER_ID" || "$USER_ID" == "null" ]]; then
              echo "No Headscale user named '$HEADSCALE_USER' was found."
              echo "Available users:"
              jq -r '.users[]? | "  id=\(.id) name=\(.name)"' <<< "$USERS"
              exit 1
            fi

            echo "Resolved Headscale user '$HEADSCALE_USER' to id $USER_ID"
          fi

          # --- Skapa ephemeral preauthkey ---
          EXPIRATION="$(date -u -d '+10 minutes' '+%Y-%m-%dT%H:%M:%SZ')"

          BODY_WITH_ID="$(
            jq -n \
              --argjson user "$USER_ID" \
              --arg expiration "$EXPIRATION" \
              '{
                user: $user,
                ephemeral: true,
                reusable: false,
                expiration: $expiration,
                aclTags: ["tag:github-runner"]
              }'
          )"

          BODY_WITH_NAME="$(
            jq -n \
              --arg user "$HEADSCALE_USER" \
              --arg expiration "$EXPIRATION" \
              '{
                user: $user,
                ephemeral: true,
                reusable: false,
                expiration: $expiration,
                aclTags: ["tag:github-runner"]
              }'
          )"

          STATUS="$(hs_api POST /api/v1/preauthkey "$BODY_WITH_ID")"
          RESPONSE="$(cat "$BODY_FILE")"

          # Headscale < 0.26 vill ha användarnamnet som strang i stallet for
          # ett numeriskt ID. Forsok igen om ID-varianten avvisades.
          if [[ "$STATUS" -ge 400 && "$STATUS" -lt 500 ]]; then
            echo "Numeric user id was rejected (HTTP $STATUS): $RESPONSE"
            echo "Retrying with the username, for older Headscale APIs."
            STATUS="$(hs_api POST /api/v1/preauthkey "$BODY_WITH_NAME")"
            RESPONSE="$(cat "$BODY_FILE")"
          fi

          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "Headscale API returned HTTP $STATUS"
            echo "Response: $RESPONSE"
            exit 1
          fi

          EPHEMERAL_KEY="$(jq -er '.preAuthKey.key' <<< "$RESPONSE")"

          echo "::add-mask::$EPHEMERAL_KEY"
          echo "key=$EPHEMERAL_KEY" >> "$GITHUB_OUTPUT"

      # Actionen skickar redan --accept-routes till "tailscale up", sa
      # subnet-rutten fran jumphosten installeras utan att vi ber om det.
      # Att upprepa flaggan har ger "flag provided multiple times".
      - name: Connect to Headscale Mesh
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ steps.generate_key.outputs.key }}
          args: --login-server=${{ secrets.HEADSCALE_URL }}
          version: 1.102.4

      - name: Verify connectivity to K3s node
        env:
          K3S_HOST: 10.0.${{ vars.TEAM_ID }}.3
        run: |
          set -euo pipefail

          # Subnet-rutten kommer via jumphosten och kan dröja nagra sekunder
          # efter att tailscale kommit upp.
          for attempt in $(seq 1 15); do
            if timeout 3 bash -c "</dev/tcp/${K3S_HOST}/6443" 2>/dev/null; then
              echo "Reached ${K3S_HOST}:6443 on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done

          echo "Could not reach ${K3S_HOST}:6443 after 15 attempts."
          echo "Installed routes:"
          ip route
          echo "Tailscale status:"
          tailscale status || true
          exit 1

      # --- Configure kubectl for remote k3s ---
      - name: Configure kubeconfig
        env:
          K3S_HOST: 10.0.${{ vars.TEAM_ID }}.3
          K3S_NAME: team${{ vars.TEAM_ID }}-primary
        run: |
          set -euo pipefail

          # KUBECONFIG pekar pa https://team<N>-primary:6443, vilket ar namnet
          # i k3s-certifikatets SAN-lista. Runnern kan inte sla upp det -- bara
          # jumphosten finns i tailnetets DNS -- sa peka namnet pa nodens IP.
          echo "${K3S_HOST} ${K3S_NAME}" | sudo tee -a /etc/hosts > /dev/null

          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl get pods -n default

      # --- Deploy to K3s ---
      - name: Apply manifests and update image
        run: |
          export DEPLOY_IMAGE="${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}"
          export GIT_COMMIT="${{ github.sha }}"
          envsubst < k8s/deployment.yaml > /tmp/deployment.yaml
          kubectl apply -f /tmp/deployment.yaml -f k8s/pvc.yaml -f k8s/service.yaml -f k8s/ingress.yaml
          kubectl rollout status deployment/company-website --timeout=120s
